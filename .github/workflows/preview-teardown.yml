name: Delete pull request preview

# When a pull request is merged or closed, deletes its preview: the `pr-<number>` Worker that the
# preview job in deploy.yml deploys. Deleting the Worker removes every version of it and every
# address it had, so nothing from the branch stays reachable.
#
# The Worker is deleted through the Cloudflare API rather than `wrangler delete`, so a pull request
# that never got a preview (a build that failed, say) can be told apart from a real failure: the
# API answers 404 for a Worker that does not exist. Anything else fails the run, so a preview that
# could not be deleted is visible on the pull request rather than left behind silently.
#
# Same skip as the preview job: pull requests from forks get no secrets and no preview.

on:
  pull_request:
    types: [closed]

permissions:
  pull-requests: write

# Shared with the preview job, so a deploy still running when the pull request closes is cancelled
# rather than recreating the Worker after it has been deleted.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  delete:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # For scripts/pr-preview-comment.sh.
      - uses: actions/checkout@v5

      - name: Delete the preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d728bc2284c2b9a503b82a3930cc7696
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          status=$(curl -sS -o response.json -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/pr-$PR_NUMBER")
          case "$status" in
            200) echo "Deleted the pr-$PR_NUMBER Worker." ;;
            404) echo "No pr-$PR_NUMBER Worker to delete." ;;
            *)
              echo "::error::Deleting the pr-$PR_NUMBER Worker failed with HTTP $status. Delete it by hand in the Cloudflare dashboard."
              cat response.json
              exit 1
              ;;
          esac

      - name: Say so on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EDIT_ONLY: 1
        run: scripts/pr-preview-comment.sh "**Preview:** deleted, as this pull request is closed."
