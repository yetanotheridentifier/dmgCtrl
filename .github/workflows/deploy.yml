name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Its own job rather than a step in `test`, so a lint failure and a test failure are reported
  # from the same push. Sharing the job meant the test step never ran once lint failed, which
  # cost a second round trip to find out the tests were broken too. It duplicates about 27s of
  # setup and install, and runs alongside `test`, so it costs runner time rather than wall time.
  # No proxy install here: nothing in it is linted.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install sealed dependencies
        run: npm install --prefix sealed

      # Each package lints with its own config, and both run at --max-warnings 0, so a warning
      # left in place fails the build.
      - name: Lint
        run: npm run lint

      - name: Lint sealed
        run: npm run lint --prefix sealed

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install proxy dependencies
        run: npm install --prefix proxy

      - name: Install sealed dependencies
        run: npm install --prefix sealed

      # Run as three steps rather than one `npm test`, each writing its own heading to the job
      # summary first. Vitest's GitHub reporter hardcodes its "## Vitest Test Report" heading and
      # puts the project name only on individual failures, so three suites in one step produced
      # three identical anonymous blocks that had to be told apart by counting tests. The final
      # step removes that hardcoded heading, leaving one named heading per suite.
      - name: Test the PWA
        run: |
          {
            echo "# PWA Test Report"
            echo "_The tracker app in \`src/\`: X-Wing, SWU tracking, Kill Team._"
          } >> "$GITHUB_STEP_SUMMARY"
          npm run test:pwa

      - name: Test the proxy worker
        run: |
          {
            echo "# Proxy Test Report"
            echo "_The card API Worker in \`proxy/\`._"
          } >> "$GITHUB_STEP_SUMMARY"
          npm --prefix proxy test

      - name: Test sealed
        run: |
          {
            echo "# Sealed Test Report"
            echo "_The Sealed game in \`sealed/\`: rules engine, AI and UI. The simulation tests run in their own workflow._"
          } >> "$GITHUB_STEP_SUMMARY"
          npm --prefix sealed test

      # `always()`, so the summary still reads properly on the run where a suite failed, which is
      # the run anyone actually opens.
      - name: Drop Vitest's own report headings
        if: always()
        run: sed -i '/^## Vitest Test Report$/d' "$GITHUB_STEP_SUMMARY"

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install sealed dependencies
        run: npm install --prefix sealed

      - name: Build
        run: npm run build

      - name: Build sealed app
        run: npm run build --prefix sealed

      - name: Assemble sealed under /sealed
        run: mkdir -p dist/sealed && cp -r sealed/dist/* dist/sealed/

      # The preview gets the build as is: the Cloudflare Vite plugin writes dist/wrangler.json and
      # dist/.assetsignore, which wrangler needs to upload it. Hidden files are left out of an
      # artifact unless asked for, and .assetsignore is one.
      - name: Upload the build for the preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v5
        with:
          name: preview-build
          path: dist
          include-hidden-files: true

      # Those two files are Cloudflare's, so GitHub Pages would otherwise publish them as part of
      # the site.
      - name: Drop the Cloudflare files from the Pages build
        run: rm dist/wrangler.json dist/.assetsignore

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Each pull request gets its own preview at https://pr-<number>.dmgctrl.workers.dev, so a branch
  # can be tried on a phone before it reaches production. The preview is a Worker of its own,
  # `pr-<number>`, which preview-teardown.yml deletes when the pull request is merged or closed.
  # A whole Worker is the unit Cloudflare can delete: there is no way to remove one version or
  # alias of a Worker, so previews as versions of a shared Worker could never be cleaned up.
  #
  # Production is GitHub Pages (the `deploy` job below) and is not touched. It deploys the exact
  # files `build` produced, so the preview is what would ship.
  #
  # Needs the `CLOUDFLARE_API_TOKEN` repository secret (Account, Workers Scripts, Edit). Pull
  # requests from forks are skipped: they get no secrets, and outside pull requests are closed
  # anyway (close-outside-prs.yml).
  preview:
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Only the comment needs write access. The group is shared with preview-teardown.yml, so a
    # later push, or the pull request closing, supersedes a deploy still in progress.
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # For wrangler, at the version the lockfile pins.
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - uses: actions/download-artifact@v5
        with:
          name: preview-build
          path: dist

      - name: Deploy the preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d728bc2284c2b9a503b82a3930cc7696
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # The build's own config, which names dist/ as the assets and carries the .assetsignore.
        run: npx wrangler deploy --config dist/wrangler.json --name "pr-$PR_NUMBER"

      # The URL comes from wrangler's own output (a full https:// URL), so the step fails loudly if
      # the Worker got no workers.dev address instead of posting a dead link.
      - name: Link the preview on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          OUTPUT: ${{ runner.temp }}/wrangler-output.json
        run: |
          url=$(jq -r 'select(.type == "deploy") | .targets[]? | select(endswith(".workers.dev"))' "$OUTPUT" | head -n 1)
          if [ -z "$url" ]; then
            echo "::error::The preview has no workers.dev address. Is workers_dev still true in wrangler.jsonc?"
            exit 1
          fi
          scripts/pr-preview-comment.sh "**Preview:** $url (sealed at $url/sealed/)

          Built from $SHA. Analytics and game records are refused from this address, so nothing reaches production data. The preview is deleted when this pull request is merged or closed."

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5