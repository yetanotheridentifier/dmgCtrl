name = "swu-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "worker.dmgctrl.app", custom_domain = true }
]

# Game record collection (POST /records, records.js). See sealed/docs/operations.md.
#
# The switch: anything but "on" and the endpoint answers 503 and stages nothing. The card routes
# are unaffected either way.
[vars]
RECORD_COLLECTION = "on"

# Where records are kept: one D1 table, `collected_games` (migrations/). The database is created by
# hand, once (`npx wrangler d1 create collected-games`), and this is its id. A deploy is refused
# while the id names no database, which is deliberate: the Worker should not go out without its store.
[[d1_databases]]
binding = "GAME_DB"
database_name = "collected-games"
database_id = "f76f66d4-0ac1-4d82-8cac-c25f3fa1ca01"
migrations_dir = "migrations"

# Where records were staged before the D1 store. The Worker no longer writes it; the binding stays so
# the games already staged can be read and moved into D1 (`--migrate`, operations.md).
[[kv_namespaces]]
binding = "GAME_RECORDS"
id = "b6f958778bec4a1790f705611db114e8"

# Per-sender limit on POST /records. Nothing to create: `namespace_id` is any number unique to this
# account's limiters. The counter is keyed on the sender's address, lives at the Cloudflare
# location that served the request for `period` seconds, and is never written beside a record.
[[ratelimits]]
name = "RECORDS_RATE_LIMITER"
namespace_id = "4051"
simple = { limit = 30, period = 60 }

# No [observability] block, on purpose: Workers Logs stay off, so no request to this Worker is
# logged with its address. Turning them on would break what the players' notice says.
